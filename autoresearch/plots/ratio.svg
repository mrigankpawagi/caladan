<svg xmlns="http://www.w3.org/2000/svg" width="502" height="240" viewBox="0 0 502 240" role="img" aria-label="The most stressed deadline kind, per policy and workload"><style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--mid:#f0efec;--neg:#2a78d6;--pos:#e34948;--base0:#898781;--base1:#52514e;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;}@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--mid:#383835;--neg:#3987e5;--pos:#e66767;--base0:#898781;--base1:#c3c2b7;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;}}text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-size:12px;fill:var(--ink2)}.bg{fill:var(--surface)}.title{font-size:15px;font-weight:600;fill:var(--ink)}.sub{font-size:12px;fill:var(--muted)}.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}.lab{font-size:12px;fill:var(--ink2)}.val{font-size:11px;fill:var(--ink);font-variant-numeric:tabular-nums}.valb{font-size:11px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}.best{fill:none;stroke:var(--ink);stroke-width:2}.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}.ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}.mid{fill:var(--mid)}.neg{fill:var(--neg)}.pos{fill:var(--pos)}.ring{stroke:var(--surface);stroke-width:2}.s1{stroke:var(--s1)}.f1{fill:var(--s1)}.s2{stroke:var(--s2)}.f2{fill:var(--s2)}.s3{stroke:var(--s3)}.f3{fill:var(--s3)}.s4{stroke:var(--s4)}.f4{fill:var(--s4)}.s5{stroke:var(--s5)}.f5{fill:var(--s5)}.s6{stroke:var(--s6)}.f6{fill:var(--s6)}.s7{stroke:var(--s7)}.f7{fill:var(--s7)}.s8{stroke:var(--s8)}.f8{fill:var(--s8)}.s-b0{stroke:var(--base0)}.f-b0{fill:var(--base0)}.s-b1{stroke:var(--base1)}.f-b1{fill:var(--base1)}.s-fold{stroke:var(--muted)}.f-fold{fil